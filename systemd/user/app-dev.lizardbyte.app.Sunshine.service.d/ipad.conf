# Run only while the iPad is plugged in (started by /etc/udev/rules.d/70-ipad-usb.rules).
[Unit]
BindsTo=sys-subsystem-net-devices-ipad0.device
After=sys-subsystem-net-devices-ipad0.device

[Service]
# Unplugged mid-stream: take the virtual screen away so windows return to eDP-1.
ExecStopPost=-%h/.local/bin/ivm display remove
