# ----------------------------------------------------- 
# Window rules
# ----------------------------------------------------- 

windowrule = match:class oyster-desktop, float on

windowrule = match:title ^(Extension: (Bitwarden Password Manager)), float on

windowrule = match:class .*, focus_on_activate on

layerrule = match:namespace notifications, animation slide
layerrule = match:namespace selection, animation none # animations will show up on screenshot

# Don't open fullscreen
windowrule = match:class ^libreoffice.*$, suppress_event maximize
windowrule = match:class yaak-app, suppress_event maximize

windowrule = match:class org.gnome.Calculator, float on

# Fix some dragging issues with XWayland
#windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

windowrule = match:class .*pavucontrol.*, float on
windowrule = match:class .*pavucontrol.*, size 920 680

# Floaters
windowrule = match:class (?i)blueman-manager, float on
windowrule = match:title ^(nm-connection-editor)$, float on 
windowrule = match:title ^(qalculate-gtk)$, float on
windowrule = match:title nwg-look, float on
windowrule = match:title nwg-displays, float on 
windowrule = match:title Select Move Destination, float on
windowrule = match:title Select Extract Destination, float on
windowrule = match:title Select Copy Destination, float on
windowrule = match:title Open File, float on
windowrule = match:title New Text Note — Okular, float on

# Browser Picture in Picture
windowrule = match:title ^(Picture-in-Picture)$, float on
windowrule = match:title ^(Picture-in-Picture)$, pin on
windowrule = match:title ^(Picture-in-Picture)$, move 69.5% 4%

# Round when floating
windowrule = match:float 1, rounding 15


# No border on single window
#windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
#windowrule = bordersize 0, floating:0, onworkspace:f[1]

# Fixes intellij tooltips
# May match things that it shouldnt
# windowrule = noinitialfocus,class:jetbrains-studio,floating:1

# Won't match unnecessairly
# fix tooltips (always have a title of `win.<id>`)
windowrule = match:class ^(.*jetbrains.*)$, match:title ^(win.*)$, no_initial_focus on
windowrule = match:class ^(.*jetbrains.*)$, match:title ^(win.*)$, no_focus on
# fix tab dragging (always have a single space character as their title)
windowrule = match:class ^(.*jetbrains.*)$, match:title ^\\s$, no_initial_focus on
windowrule = match:class ^(.*jetbrains.*)$, match:title ^\\s$, no_focus on

# Prevent citrix bugs
windowrule = match:title ^(SOLIDWORKS)$, maximize on

windowrule = match:title kitty-floating, float 1
