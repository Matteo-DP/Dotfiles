source=/home/nekros/.config/hypr/colors.conf

label {
  monitor = 
  text = cmd[update:1000] echo "$(~/.config/hypr/scripts/song-status.sh)"
  color = rgba(242, 243, 244, 0.75)
  font_size = 14
  # font_family = SF Pro Text
  font_family = JetBrainsMono Nerd Font
  position = 20, 512
  halign = left
  valign = center
}

