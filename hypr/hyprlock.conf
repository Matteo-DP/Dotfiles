label {
  monitor =
  text = cmd[update:1000] echo "$(~/.config/hypr/scripts/battery-status.sh)‎"
  color = rgba(242, 243, 244, 0.75)
  font_size = 19
  font_family = SF Pro Text
  position = -20, -10
  halign = right
  valign = top
}

background {
    monitor =
    path = ~/.cache/wallpaper/current_wallpaper_symlink

    # all these options are taken from hyprland, see https://wiki.hyprland.org/Configuring/Variables/#blur for explanations
    blur_size = 1
    blur_passes = 3 # 0 disables blurring
    noise = 0.0117
    contrast = 1.3000 # Vibrant!!!
    brightness = 0.9000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}


auth {
	fingerprint {
		enabled = true
        ready_message = 
		present_message = 
		retry_delay = 500
	}
}

label {
	monitor = 
	text = $FPRINTPROMPT
    font_size = 32
    font_family = JetBrainsMono Nerd Font
	position = 0, -500
	halign = center
	valign = center
}

# Hours
label {
    monitor =
    text = cmd[update:1000] echo "<b> $(date +"%H") </b>"
    color = rgb($COLOR6)
    # color = rgba(242, 243, 244, 0.75)
    font_size = 112
    font_family = JetBrainsMono Nerd Font
    # shadow_passes = 3
    # shadow_size = 4

   position = 70, 100
    halign = right
    valign = bottom
}

# Minutes
label {
    monitor =
    text = cmd[update:1000] echo "<b> $(date +"%M") </b>"
    # color = rgb($COLOR6)
    color = rgba(242, 243, 244, 0.75)
    font_size = 112
    font_family = JetBrainsMono Nerd Font
    # shadow_passes = 3
    # shadow_size = 4

    position = 70, -20
    halign = right
    valign = bottom
}

# Today
label {
    monitor =
    text = cmd[update:18000000] echo "$(date +'%A %d %b')"
    color = rgb($COLOR7)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    # font_family = SF Pro Text

    position = 20, 20
    halign = left
    valign = bottom
}

